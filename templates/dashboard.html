<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

    <div class="dashboard-container">

        <div class="dashboard-card">


            <div class="dashboard-header">

                <h1>
                    Welcome, {{ user["full_name"] }}!
                </h1>

                {% if session.get("login_message") %}
                    <p class="success-message">
                        {{ session.pop("login_message") }}
                    </p>
                {% endif %}

                <p>
                    Student Study Planner Dashboard
                </p>

            </div>

            <div class="student-info">

                <div class="info-item">
                    <strong>Student ID</strong>
                    {{ user["student_id"] }}
                </div>

                <div class="info-item">
                    <strong>Email</strong>
                    {{ user["email"] }}
                </div>

                <div class="info-item">
                    <strong>Course</strong>
                    {{ user["course"] }}
                </div>

                <div class="info-item">
                    <strong>Semester</strong>
                    {{ user["semester"] }}
                </div>

            </div>

<div class="navigation">

    <a href="{{ url_for('profile') }}">
        <button type="button">My Profile</button>
    </a>

    <a href="{{ url_for('planner') }}">
        <button type="button">Study Planner</button>
    </a>

    <a href="{{ url_for('subjects') }}">
        <button type="button">Subject Setup</button>
    </a>

    <a href="{{ url_for('add_study') }}">
        <button type="button">Add Study Session</button>
    </a>

    <a href="{{ url_for('goals') }}">
        <button type="button">Goals</button>
    </a>

    <a href="{{ url_for('attendance') }}">
        <button type="button">Attendance Tracker</button>
    </a>

    <a href="{{ url_for('marks') }}">
        <button type="button">Marks Tracker</button>
    </a>

    <a href="{{ url_for('performance') }}">
        <button type="button">Performance</button>
    </a>

    <a href="{{ url_for('logout') }}"
       onclick="return confirm('Are you sure you want to logout?');">
        <button type="button">Logout</button>
    </a>

</div>        

    </div>

</body>

</html>
