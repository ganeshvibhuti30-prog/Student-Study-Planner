<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Exam</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/exams.css') }}">
</head>

<body>

    <div class="exams-container">

        <div class="exams-card">

            <div class="page-header">

                <h1>Edit Exam</h1>

                <p>
                    Update your exam details
                </p>

            </div>

            <form
                action="{{ url_for('edit_exam', exam_id=exam['id']) }}"
                method="POST"
            >

                <label for="subject_id">
                    Subject
                </label>

                <select
                    id="subject_id"
                    name="subject_id"
                    required
                >

                    {% for subject in subjects %}

                        <option
                            value="{{ subject['id'] }}"
                            {% if subject['id'] == exam['subject_id'] %}
                                selected
                            {% endif %}
                        >
                            {{ subject['subject_code'] }} -
                            {{ subject['subject_name'] }}
                        </option>

                    {% endfor %}

                </select>


                <label for="exam_date">
                    Exam Date
                </label>

                <input
                    type="date"
                    id="exam_date"
                    name="exam_date"
                    value="{{ exam['exam_date'] }}"
                    required
                >


                <label for="exam_time">
                    Exam Time
                </label>

                <input
                    type="time"
                    id="exam_time"
                    name="exam_time"
                    value="{{ exam['exam_time'] }}"
                    required
                >


                <label for="exam_type">
                    Exam Type
                </label>

                <select
                    id="exam_type"
                    name="exam_type"
                    required
                >

                    <option value="CA1"
                        {% if exam['exam_type'] == 'CA1' %}selected{% endif %}>
                        CA1
                    </option>

                    <option value="CA2"
                        {% if exam['exam_type'] == 'CA2' %}selected{% endif %}>
                        CA2
                    </option>

                    <option value="CA3"
                        {% if exam['exam_type'] == 'CA3' %}selected{% endif %}>
                        CA3
                    </option>

                    <option value="Mid Semester"
                        {% if exam['exam_type'] == 'Mid Semester' %}selected{% endif %}>
                        Mid Semester
                    </option>

                    <option value="End Semester"
                        {% if exam['exam_type'] == 'End Semester' %}selected{% endif %}>
                        End Semester
                    </option>

                    <option value="Practical"
                        {% if exam['exam_type'] == 'Practical' %}selected{% endif %}>
                        Practical
                    </option>

                    <option value="Other"
                        {% if exam['exam_type'] == 'Other' %}selected{% endif %}>
                        Other
                    </option>

                </select>


                <label for="preparation_status">
                    Preparation Status
                </label>

                <select
                    id="preparation_status"
                    name="preparation_status"
                    required
                >

                    <option value="Not Started"
                        {% if exam['preparation_status'] == 'Not Started' %}selected{% endif %}>
                        Not Started
                    </option>

                    <option value="Started"
                        {% if exam['preparation_status'] == 'Started' %}selected{% endif %}>
                        Started
                    </option>

                    <option value="Well Prepared"
                        {% if exam['preparation_status'] == 'Well Prepared' %}selected{% endif %}>
                        Well Prepared
                    </option>

                    <option value="Completed"
                        {% if exam['preparation_status'] == 'Completed' %}selected{% endif %}>
                        Completed
                    </option>

                </select>


                <button type="submit">
                    Save Changes
                </button>

            </form>


            <div class="navigation">

                <a href="{{ url_for('exams') }}">
                    Back to Exams
                </a>

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

            </div>

        </div>

    </div>

</body>

</html>
